name: pedido-estoque-app

# Infrastructure lives in the separate pedido-estoque-system-infra repository.
# Start that Compose project first; it creates this shared network and the
# kafka, postgres-pedidos, postgres-estoque, and redis DNS names used below.
x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
  APP_ENV: ${APP_ENV:-local}
  # LocalStack (perfil aws). Para AWS real, remova/ajuste o endpoint e as credenciais.
  SPRING_CLOUD_AWS_ENDPOINT: ${SPRING_CLOUD_AWS_ENDPOINT:-http://localstack:4566}
  SPRING_CLOUD_AWS_REGION_STATIC: ${SPRING_CLOUD_AWS_REGION_STATIC:-us-east-1}
  SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:-test}
  SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:-test}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  DD_ENV: ${DD_ENV:-local}
  DD_VERSION: ${DD_VERSION:-local}
  DD_AGENT_HOST: ${DD_AGENT_HOST:-datadog-agent}
  DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
  DD_LOGS_INJECTION: "true"
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_TRACE_SAMPLE_RATE: "1"

services:
  pedido-service:
    build:
      context: .
      args:
        MODULE: pedido-service
    environment:
      <<: *common-env
      DD_SERVICE: pedido-service
      DB_HOST: postgres-pedidos
      DB_NAME: pedidos_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "pedido-service"}]'
    networks:
      - pedido-estoque-network

  estoque-service:
    build:
      context: .
      args:
        MODULE: estoque-service
    environment:
      <<: *common-env
      DD_SERVICE: estoque-service
      DB_HOST: postgres-estoque
      DB_NAME: estoque_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "estoque-service"}]'
    networks:
      - pedido-estoque-network

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    depends_on:
      pedido-service:
        condition: service_started
      estoque-service:
        condition: service_started
    environment:
      <<: *common-env
      DD_SERVICE: api-gateway
      REDIS_HOST: redis
      PEDIDO_SERVICE_URI: http://pedido-service:8081
      ESTOQUE_SERVICE_URI: http://estoque-service:8082
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/pedido-estoque}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/pedido-estoque/protocol/openid-connect/certs}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-pedido-estoque-api}
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "api-gateway"}]'
    ports:
      - "8080:8080"
    networks:
      - pedido-estoque-network

networks:
  pedido-estoque-network:
    external: true
    name: pedido-estoque-network
