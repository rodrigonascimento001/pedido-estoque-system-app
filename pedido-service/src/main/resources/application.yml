server:
  port: 8081

spring:
  application:
    name: pedido-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: pedido-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rodrigo.pedidos.comum.events"
        # JsonSerializer/JsonDeserializer usam o header __TypeId__ por padrão
        # para mapear a classe correta em cada tópico (estoque-reservado vs estoque-indisponivel).

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  statsd:
    metrics:
      export:
        # desligado por padrão (dev local e testes); o perfil "datadog" liga
        enabled: false
