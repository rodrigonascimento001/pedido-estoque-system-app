server:
  port: 8081

spring:
  application:
    name: pedido-service

  # Os starters do Spring Cloud AWS (módulo common) criam o SecretsManagerClient mesmo fora do
  # perfil "aws", e o SDK exige uma região só para instanciar o client (não há chamada de rede).
  # Sem isto o contexto não sobe em máquina/CI sem ~/.aws ou AWS_REGION. Em produção, AWS_REGION vence.
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Preserva byte[] ao publicar no DLT registros que não puderam ser desserializados
      value-serializer: com.rodrigo.pedidos.comum.kafka.BytesPreservingJsonSerializer
      acks: all
    consumer:
      group-id: pedido-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Falha de desserialização vira DeserializationException (vai ao DLT) em vez de travar o poll()
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.rodrigo.pedidos.comum.events"
        # JsonSerializer/JsonDeserializer usam o header __TypeId__ por padrão
        # para mapear a classe correta em cada tópico (estoque-reservado vs estoque-indisponivel).

app:
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    lease-ms: ${OUTBOX_LEASE_MS:30000}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}
  kafka:
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:2000}

management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  statsd:
    metrics:
      export:
        # desligado por padrão (dev local e testes); o perfil "datadog" liga
        enabled: false
