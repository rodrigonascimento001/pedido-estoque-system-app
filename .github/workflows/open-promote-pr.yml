name: Open promote PR (develop -> main)

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-promote-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    name: Open develop -> main PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch origin main develop --quiet

          ahead="$(git rev-list --count origin/main..origin/develop)"
          if [ "$ahead" -eq 0 ]; then
            echo "No commits to promote from develop to main."
            exit 0
          fi

          existing="$(gh pr list --base main --head develop --state open --json number --jq 'length')"
          if [ "$existing" -gt 0 ]; then
            echo "A develop -> main pull request is already open."
            exit 0
          fi

          gh pr create \
            --base main \
            --head develop \
            --title "Promote develop to main" \
            --body "Automated promotion PR opened after a push to \`develop\`. Review the accumulated changes and merge when the develop pipeline is green."
